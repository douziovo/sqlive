name: CI

on:
  push:
    branches: [main, future]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sqlive-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: sqlive-backend
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/future' }}
      - run: gradle test

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: sqlive-frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: sqlive-frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: sqlive-frontend
        run: pnpm run test

  e2e:
    runs-on: ubuntu-latest
    needs: frontend-test
    env:
      BACKEND_BOOT_CMD: gradle bootRun
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: sqlive-backend
          cache-read-only: true

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: sqlive-frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: sqlive-frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('sqlive-frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: sqlive-frontend
        run: pnpm exec playwright install --with-deps chromium msedge

      - name: Run E2E tests
        working-directory: sqlive-frontend
        run: pnpm exec playwright test --config tests/e2e/playwright.config.ts --project=chromium --project=edge
