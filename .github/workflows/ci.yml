name: CI

on:
  push:
    branches: [master, future]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sqlive-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        # IDE 离线无法解析 action.yml，with 输入会被误报为未定义形参
        #noinspection UndefinedParamsPresent
        with:
          java-version: '25'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@v4
        # IDE 离线无法解析 action.yml，with 输入会被误报为未定义形参
        #noinspection UndefinedParamsPresent
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/future' }}
      - run: ./gradlew test

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        # IDE 离线无法解析 action.yml，with 输入会被误报为未定义形参
        #noinspection UndefinedParamsPresent
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        # IDE 离线无法解析 action.yml，with 输入会被误报为未定义形参
        #noinspection UndefinedParamsPresent
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: sqlive-frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: sqlive-frontend
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        working-directory: sqlive-frontend
        run: pnpm run format:check

      - name: Run frontend lint
        working-directory: sqlive-frontend
        run: pnpm run lint

      - name: Run frontend type check
        working-directory: sqlive-frontend
        run: pnpm run typecheck

      - name: Build frontend
        working-directory: sqlive-frontend
        run: pnpm run build

      - name: Run frontend tests
        working-directory: sqlive-frontend
        run: pnpm run test

  e2e:
    runs-on: ubuntu-latest
    needs: frontend-test
    timeout-minutes: 25
    env:
      BACKEND_BOOT_CMD: ./gradlew --no-daemon bootRun
      DEBUG: pw:webserver,pw:test:task
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        # IDE 离线无法解析 action.yml，with 输入会被误报为未定义形参
        #noinspection UndefinedParamsPresent
        with:
          java-version: '25'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v4
        # IDE 离线无法解析 action.yml，with 输入会被误报为未定义形参
        #noinspection UndefinedParamsPresent
        with:
          cache-read-only: true

      - uses: pnpm/action-setup@v6
        # IDE 离线无法解析 action.yml，with 输入会被误报为未定义形参
        #noinspection UndefinedParamsPresent
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        # IDE 离线无法解析 action.yml，with 输入会被误报为未定义形参
        #noinspection UndefinedParamsPresent
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: sqlive-frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: sqlive-frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        # IDE 离线无法解析 action.yml，with 输入会被误报为未定义形参
        #noinspection UndefinedParamsPresent
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('sqlive-frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: sqlive-frontend
        run: pnpm exec playwright install --with-deps chromium msedge

      - name: Run E2E tests
        working-directory: sqlive-frontend
        timeout-minutes: 20
        run: pnpm exec playwright test --config tests/e2e/playwright.config.ts --project=chromium --project=edge

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            sqlive-frontend/playwright-report/
            sqlive-frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
