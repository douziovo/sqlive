plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'sqlive-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacoco {
    // 0.8.14 is the first release with official Java 25 support.
    toolVersion = '0.8.14'
}

// Security overrides for BOM-managed transitive dependencies.
// Spring Boot 4.1.1 still pins releases that carry security advisories, so the
// managed version of each affected artifact is raised to the latest patched
// release of the same minor line (logback 1.5.x is EOL at 1.5.38, hence 1.6.x).
// These are read by io.spring.dependency-management when it parses the BOM.
ext['tomcat.version'] = '11.0.27'          // was 11.0.24
ext['netty.version'] = '4.2.20.Final'      // was 4.2.17.Final
ext['logback.version'] = '1.6.6'           // was 1.5.38
ext['jackson-2-bom.version'] = '2.21.8'    // was 2.21.5
ext['jackson-bom.version'] = '3.1.8'       // was 3.1.5 (tools.jackson 3.x)
ext['json-smart.version'] = '2.6.1'        // was 2.6.0; also lifts asm to 9.11.1

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    // jsonassert 1.5.3 depends on com.vaadin.external.google:android-json, a 2013
    // fork of org.json that has no patched release. Drop it and use the
    // maintained org.json artifact instead (same org.json.* API).
    configureEach {
        exclude group: 'com.vaadin.external.google', module: 'android-json'
    }
}
repositories {
    maven { url 'https://maven.aliyun.com/repository/public/' }
    maven { url 'https://maven.aliyun.com/repository/spring/' }
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.15.0'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'

    // springdoc 3.x — Spring Boot 4.1 compatible. 2.x is SB3-only.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // Replaces the excluded android-json fork required by jsonassert 1.5.3.
    testImplementation 'org.json:json:20260814'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

tasks.named('test', Test) {
    useJUnitPlatform()
    def cpu = Runtime.runtime.availableProcessors()
    int halfCpus = (cpu / 2) as int
    // Measured on this 24-core/16GB box (~4-5GB RAM typically free, heavy background load):
    // - more forks (6/8) don't help: memory-bound, 8 forks was clearly slower
    // - MaxRAMPercentage 50 -> 12 (4 x 12 = 48% worst-case aggregate heap cap, was 200%)
    // - -XX:TieredStopAtLevel=1 (C1 only): short-lived test JVMs warm up faster;
    //   interleaved A/B (3 paired runs): 52/28/38s vs 57/42/46s with original flags
    maxParallelForks = Math.max(1, Math.min(halfCpus, 4))
    jvmArgs '--enable-native-access=ALL-UNNAMED',
            '-Xshare:auto', '-XX:+UseParallelGC', '-XX:MaxRAMPercentage=12.0',
            '-XX:TieredStopAtLevel=1'
    finalizedBy jacocoTestReport
}

tasks.named('bootRun') {
    // SQLite JDBC loads its native library on Java 25.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// Coverage gating. Enabled via CI=true, -Djacoco=true (JVM system property)
// or -Pjacoco=true (Gradle project property — the documented local command).
// The property is captured at configuration time (config-cache compatible).
def jacocoGradleProp = providers.gradleProperty('jacoco').getOrElse('')
Closure<Boolean>jacocoCoverageEnabled = {
    System.getenv('CI') == 'true' || System.getProperty('jacoco') == 'true' ||
            jacocoGradleProp == 'true'
}

// The only allowed exclusion: the Spring Boot launcher's main() cannot be
// executed inside a test JVM. Everything else must stay covered.
def jacocoClassExclusions = ['**/SqliveApplication.class']

jacocoTestReport {
    onlyIf jacocoCoverageEnabled
    dependsOn test
    classDirectories.setFrom(files(sourceSets.main.output.collect {
        fileTree(dir: it, exclude: jacocoClassExclusions)
    }))
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    onlyIf jacocoCoverageEnabled
    classDirectories.setFrom(files(sourceSets.main.output.collect {
        fileTree(dir: it, exclude: jacocoClassExclusions)
    }))
    violationRules {
        rule {
            // Keep line coverage at 98% or above.
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.98
            }
            // Keep branch coverage at 98% or above.
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.98
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
