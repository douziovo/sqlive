plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'sqlive-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacoco {
    // 0.8.14 is the first release with official Java 25 support.
    toolVersion = '0.8.14'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}
repositories {
    maven { url 'https://maven.aliyun.com/repository/public/' }
    maven { url 'https://maven.aliyun.com/repository/spring/' }
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    //noinspection GrUnresolvedAccess
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'

    // springdoc 3.x — Spring Boot 4.1 compatible. 2.x is SB3-only.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

tasks.named('test') {
    //noinspection GrUnresolvedAccess
    useJUnitPlatform()
    def cpu = Runtime.runtime.availableProcessors()
    // Measured on this 24-core/16GB box (~4-5GB RAM typically free, heavy background load):
    // - more forks (6/8) don't help: memory-bound, 8 forks was clearly slower
    // - MaxRAMPercentage 50 -> 12 (4 x 12 = 48% worst-case aggregate heap cap, was 200%)
    // - -XX:TieredStopAtLevel=1 (C1 only): short-lived test JVMs warm up faster;
    //   interleaved A/B (3 paired runs): 52/28/38s vs 57/42/46s with original flags
    maxParallelForks = Math.max(1, Math.min((cpu / 2) as int, 4))
    jvmArgs '--enable-native-access=ALL-UNNAMED',
            '-Xshare:auto', '-XX:+UseParallelGC', '-XX:MaxRAMPercentage=12.0',
            '-XX:TieredStopAtLevel=1'
    finalizedBy jacocoTestReport
}

tasks.named('bootRun') {
    // SQLite JDBC loads its native library on Java 25.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

jacocoTestReport {
    onlyIf { System.getenv('CI') == 'true' || System.getProperty('jacoco') == 'true' }
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    onlyIf { System.getenv('CI') == 'true' || System.getProperty('jacoco') == 'true' }
    violationRules {
        rule {
            limit {
                minimum = 0.50
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
